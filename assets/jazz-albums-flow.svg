        <image href="./jazz-covers/cover-04.jpg" x="12" y="12" width="126" height="126" preserveAspectRatio="xMidYMid slice" clip-path="url(#cover-clip)"/>
        <text x="18" y="116" class="title">Album 04</text>
        <text x="18" y="132" class="subtitle">Jazz Pick</text>
