<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Flowing jazz album wall">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1633"/>
      <stop offset="100%" stop-color="#091225"/>
    </linearGradient>
    <clipPath id="cover-clip">
      <rect x="12" y="12" width="126" height="126" rx="10"/>
    </clipPath>
    <style>
      .title { font: 700 13px 'Trebuchet MS', 'Segoe UI', sans-serif; fill: #f3efe6; }
      .subtitle { font: 500 10px 'Trebuchet MS', 'Segoe UI', sans-serif; fill: #d4cfbf; }
      .panel { fill: rgba(5, 8, 16, 0.86); }
    </style>
    <symbol id="album-card" viewBox="0 0 150 150">
      <rect x="0" y="0" width="150" height="150" rx="14" fill="#111b34"/>
      <rect x="12" y="12" width="126" height="126" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.24)"/>
      <rect x="12" y="101" width="126" height="37" rx="0" class="panel"/>
    </symbol>
  </defs>

  <rect width="1200" height="190" fill="url(#bg)"/>

  <g transform="translate(0,20)">
    <g id="track-a">
      <g transform="translate(0,0)">
        <use href="#album-card"/>
        <image href="./jazz-covers/cover-01.jpg" x="12" y="12" width="126" height="126" preserveAspectRatio="xMidYMid slice" clip-path="url(#cover-clip)"/>
        <text x="18" y="116" class="title">Album 01</text>
        <text x="18" y="132" class="subtitle">Jazz Pick</text>
      </g>
      <g transform="translate(170,0)">
        <use href="#album-card"/>
        <image href="./jazz-covers/cover-02.jpg" x="12" y="12" width="126" height="126" preserveAspectRatio="xMidYMid slice" clip-path="url(#cover-clip)"/>
        <text x="18" y="116" class="title">Album 02</text>
        <text x="18" y="132" class="subtitle">Jazz Pick</text>
      </g>
      <g transform="translate(340,0)">
        <use href="#album-card"/>
        <image href="./jazz-covers/cover-03.jpg" x="12" y="12" width="126" height="126" preserveAspectRatio="xMidYMid slice" clip-path="url(#cover-clip)"/>
        <text x="18" y="116" class="title">Album 03</text>
        <text x="18" y="132" class="subtitle">Jazz Pick</text>
      </g>
      <g transform="translate(510,0)">
