        <image href="./jazz-covers/cover-05.jpg" x="12" y="12" width="126" height="126" preserveAspectRatio="xMidYMid slice" clip-path="url(#cover-clip)"/>
        <text x="18" y="116" class="title">Album 05</text>
        <text x="18" y="132" class="subtitle">Jazz Pick</text>
      </g>
      <g transform="translate(850,0)">
        <use href="#album-card"/>
        <image href="./jazz-covers/cover-06.jpg" x="12" y="12" width="126" height="126" preserveAspectRatio="xMidYMid slice" clip-path="url(#cover-clip)"/>
        <text x="18" y="116" class="title">Album 06</text>
        <text x="18" y="132" class="subtitle">Jazz Pick</text>
      </g>
      <g transform="translate(1020,0)">
        <use href="#album-card"/>
        <image href="./jazz-covers/cover-07.jpg" x="12" y="12" width="126" height="126" preserveAspectRatio="xMidYMid slice" clip-path="url(#cover-clip)"/>
        <text x="18" y="116" class="title">Album 07</text>
