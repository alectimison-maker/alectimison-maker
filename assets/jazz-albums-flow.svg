        <text x="18" y="132" class="subtitle">Jazz Pick</text>
      </g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1360 0" dur="36s" repeatCount="indefinite"/>
    </g>

    <g id="track-b" transform="translate(1360,0)">
