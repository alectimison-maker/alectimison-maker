<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="170" viewBox="0 0 1080 170" role="img" aria-label="Favorite Writers Tags">
  <defs>
    <linearGradient id="tag-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF7FF" />
      <stop offset="100%" stop-color="#F2E9FF" />
    </linearGradient>
    <linearGradient id="tag-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8A2FF" />
      <stop offset="100%" stop-color="#B892FF" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#E2D3FF" flood-opacity="0.8" />
    </filter>
  </defs>

  <g filter="url(#soft-shadow)" font-family="'Trebuchet MS', 'Avenir Next', 'Segoe UI', sans-serif" font-size="22" fill="#5C4A87">
    <g transform="translate(20 20)">
      <rect width="260" height="50" rx="18" fill="url(#tag-fill)" stroke="url(#tag-stroke)" stroke-width="2" />
      <circle cx="24" cy="25" r="6" fill="#C8A2FF" />
      <text x="44" y="32">Haruki Murakami</text>
    </g>

    <g transform="translate(300 20)">
      <rect width="230" height="50" rx="18" fill="url(#tag-fill)" stroke="url(#tag-stroke)" stroke-width="2" />
      <circle cx="24" cy="25" r="6" fill="#C8A2FF" />
      <text x="44" y="32">Virginia Woolf</text>
    </g>

    <g transform="translate(550 20)">
      <rect width="220" height="50" rx="18" fill="url(#tag-fill)" stroke="url(#tag-stroke)" stroke-width="2" />
      <circle cx="24" cy="25" r="6" fill="#C8A2FF" />
      <text x="44" y="32">Italo Calvino</text>
    </g>

    <g transform="translate(790 20)">
      <rect width="270" height="50" rx="18" fill="url(#tag-fill)" stroke="url(#tag-stroke)" stroke-width="2" />
      <circle cx="24" cy="25" r="6" fill="#C8A2FF" />
      <text x="44" y="32">Gabriel Garcia Marquez</text>
    </g>

    <g transform="translate(120 95)">
      <rect width="250" height="50" rx="18" fill="url(#tag-fill)" stroke="url(#tag-stroke)" stroke-width="2" />
      <circle cx="24" cy="25" r="6" fill="#C8A2FF" />
      <text x="44" y="32">Fernando Pessoa</text>
    </g>

    <g transform="translate(400 95)">
      <rect width="250" height="50" rx="18" fill="url(#tag-fill)" stroke="url(#tag-stroke)" stroke-width="2" />
      <circle cx="24" cy="25" r="6" fill="#C8A2FF" />
      <text x="44" y="32">William Faulkner</text>
    </g>

    <g transform="translate(680 95)">
      <rect width="220" height="50" rx="18" fill="url(#tag-fill)" stroke="url(#tag-stroke)" stroke-width="2" />
      <circle cx="24" cy="25" r="6" fill="#C8A2FF" />
      <text x="44" y="32">Albert Camus</text>
    </g>
  </g>
</svg>
