<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="96" viewBox="0 0 1080 96" role="img" aria-label="Favorite Writers Tags">
  <defs>
    <linearGradient id="tag-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6E8CB" />
      <stop offset="100%" stop-color="#ECD9B6" />
    </linearGradient>
    <linearGradient id="tag-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A4E2D" />
      <stop offset="100%" stop-color="#9E6A43" />
    </linearGradient>
    <linearGradient id="tag-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#7A4E2D" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#soft-shadow)" font-family="'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif" font-size="15.5" fill="#3F2A1D" letter-spacing="0.1">
    <g transform="translate(128 10)">
      <rect width="178" height="32" rx="9" fill="url(#tag-fill)" stroke="url(#tag-stroke)" stroke-width="1.5" />
      <rect x="1.5" y="1.5" width="175" height="14" rx="7" fill="url(#tag-shine)" />
      <circle cx="14" cy="16" r="3.6" fill="#9E6A43" />
      <text x="26" y="21.6">Haruki Murakami</text>
    </g>

    <g transform="translate(314 10)">
      <rect width="162" height="32" rx="9" fill="url(#tag-fill)" stroke="url(#tag-stroke)" stroke-width="1.5" />
      <rect x="1.5" y="1.5" width="159" height="14" rx="7" fill="url(#tag-shine)" />
      <circle cx="14" cy="16" r="3.6" fill="#9E6A43" />
      <text x="26" y="21.6">Virginia Woolf</text>
    </g>

    <g transform="translate(484 10)">
      <rect width="148" height="32" rx="9" fill="url(#tag-fill)" stroke="url(#tag-stroke)" stroke-width="1.5" />
      <rect x="1.5" y="1.5" width="145" height="14" rx="7" fill="url(#tag-shine)" />
      <circle cx="14" cy="16" r="3.6" fill="#9E6A43" />
      <text x="26" y="21.6">Italo Calvino</text>
    </g>

    <g transform="translate(640 10)">
      <rect width="226" height="32" rx="9" fill="url(#tag-fill)" stroke="url(#tag-stroke)" stroke-width="1.5" />
      <rect x="1.5" y="1.5" width="223" height="14" rx="7" fill="url(#tag-shine)" />
      <circle cx="14" cy="16" r="3.6" fill="#9E6A43" />
      <text x="26" y="21.6">Gabriel Garcia Marquez</text>
    </g>

    <g transform="translate(286 52)">
      <rect width="176" height="32" rx="9" fill="url(#tag-fill)" stroke="url(#tag-stroke)" stroke-width="1.5" />
      <rect x="1.5" y="1.5" width="173" height="14" rx="7" fill="url(#tag-shine)" />
      <circle cx="14" cy="16" r="3.6" fill="#9E6A43" />
      <text x="26" y="21.6">Fernando Pessoa</text>
    </g>

    <g transform="translate(470 52)">
      <rect width="178" height="32" rx="9" fill="url(#tag-fill)" stroke="url(#tag-stroke)" stroke-width="1.5" />
      <rect x="1.5" y="1.5" width="175" height="14" rx="7" fill="url(#tag-shine)" />
      <circle cx="14" cy="16" r="3.6" fill="#9E6A43" />
      <text x="26" y="21.6">William Faulkner</text>
    </g>

    <g transform="translate(656 52)">
      <rect width="146" height="32" rx="9" fill="url(#tag-fill)" stroke="url(#tag-stroke)" stroke-width="1.5" />
      <rect x="1.5" y="1.5" width="143" height="14" rx="7" fill="url(#tag-shine)" />
      <circle cx="14" cy="16" r="3.6" fill="#9E6A43" />
      <text x="26" y="21.6">Albert Camus</text>
    </g>
  </g>
</svg>
